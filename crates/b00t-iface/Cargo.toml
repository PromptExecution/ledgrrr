[package]
name = "b00t-iface"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "b00t process interface library — lifecycle management for MCP servers, sidecars, and daemons"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
notify = "8"
datum = { path = "../datum" }
reqwest = { workspace = true, optional = true }
dirs = "6"
# Pinned to an exact version, matching this workspace's other scxml pins
# (_b00t_#1177 P7/P8): small bus factor (2 contributors, 0.x semver).
scxml = { version = "=0.2.2", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
b00t = []
autoresearch = ["b00t", "dep:reqwest"]
real_datums = []
# 🤓 statechart: W3C SCXML export for SurfaceMachine (_b00t_#1177 P8)
statechart = ["dep:scxml"]

[lints]
workspace = true
