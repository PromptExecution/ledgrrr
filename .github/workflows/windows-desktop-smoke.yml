name: Windows Desktop Dogfood Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop-smoke.yml'
      - '.github/workflows/mcpb-publish.yml'
      - 'Justfile'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/ledgerr-desktop-agent/**'
      - 'crates/ledgerr-host/**'
      - 'crates/holon-viz/**'
      - 'scripts/windows-package.ps1'
      - 'windows/package/**'
      - 'book/**'

permissions:
  contents: read

jobs:
  test-install:
    name: Test-signed sparse MSIX install/repair/uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run complete Windows dogfood acceptance flow
        shell: pwsh
        run: ./scripts/windows-package.ps1 -Action TestInstall -Version 0.1.0

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-dogfood-diagnostics
          path: |
            dist/windows/*.json
            dist/windows/*.sha256
          if-no-files-found: ignore
