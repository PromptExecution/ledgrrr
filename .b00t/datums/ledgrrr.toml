# Source-controlled Windows desktop package contract. Build outputs are not
# committed because their paths and hashes are machine/release specific.
[datum]
name = "ledgrrr.desktop"
version = "1"
kind = "package"

[build]
recipe = "wsl2-pwsh-msix-build"
package_format = "msix-external-location"
signing = "test-signed"

[artifact]
msix = "dist/windows/ledgrrr-<version>-test-signed.msix"
external_payload = "dist/windows/ledgrrr-<version>-external-payload.zip"
support_manifest = "windows/package/support-manifest.json"
