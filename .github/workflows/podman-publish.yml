name: Publish Podman Image

on:
  workflow_run:
    workflows: ["CI with MCP Registry Publish"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-podman:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      TEST_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Reclaim runner storage and verify build capacity
        run: |
          sudo docker system prune --all --force || true
          podman system reset --force || true
          available_gib=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          minimum_gib=20
          df -h /
          if [ "$available_gib" -lt "$minimum_gib" ]; then
            echo "Insufficient disk for a reliable container build: ${available_gib} GiB available; ${minimum_gib} GiB required."
            exit 1
          fi

      - name: Compute image tags
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHA_TAG=${TEST_SHA}" >> "$GITHUB_ENV"

      - name: Login to GHCR (Podman)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image with Podman
        run: |
          podman build \
            --layers=false \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:${SHA_TAG}" \
            .

      - name: Push image tags with Podman
        run: |
          podman push "${IMAGE}:main"
          podman push "${IMAGE}:${SHA_TAG}"
