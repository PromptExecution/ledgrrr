# Source-controlled Tauri payload contract; generated hashes belong in the
# release provenance rather than this repository-local datum.
[datum]
name = "ledgrrr.tauri"
version = "1"
kind = "binary"

[build]
recipe = "wsl2-pwsh-tauri-build"
package_format = "msix-external-location"

[artifact]
binary = "ledgrrr-tray.exe"
payload = "dist/windows/payload"
